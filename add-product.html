<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#ffffff"
    >

    <title>Add Product | Zyaco food Market</title>

    <link
        rel="stylesheet"
        href="CSS/app.css"
    >

    <link
        rel="stylesheet"
        href="CSS/product-form.css"
    >

</head>


<body>

<div id="app">


    <!-- HEADER -->

    <header class="app-header">

        <div class="header-left">

            <button
                class="icon-button"
                type="button"
                onclick="history.back()"
            >
                ←
            </button>

            <div class="brand">

                <span class="brand-name">
                    Add Product
                </span>

                <span class="brand-subtitle">
                    Create new product
                </span>

            </div>

        </div>

    </header>



    <!-- MAIN -->

    <main class="form-main">

        <form
            class="product-form"
            id="productForm"
        >


            <!-- IMAGE -->

            <section class="form-section">

                <div class="form-section-title">

                    <h2>
                        Product Image
                    </h2>

                    <span>
                        Optional
                    </span>

                </div>


                <label
                    class="image-upload"
                    for="productImage"
                >

                    <div
                        class="image-preview"
                        id="imagePreview"
                    >

                        <span>
                            +
                        </span>

                        <small>
                            Add image
                        </small>

                    </div>

                    <input
                        type="file"
                        id="productImage"
                        accept="image/*"
                        hidden
                    >

                </label>

            </section>



            <!-- BASIC INFORMATION -->

            <section class="form-section">

                <div class="form-section-title">

                    <h2>
                        Basic Information
                    </h2>

                </div>


                <div class="form-group">

                    <label for="productName">
                        Product Name
                    </label>

                    <input
                        type="text"
                        id="productName"
                        placeholder="e.g. Mosi Big"
                        autocomplete="off"
                        required
                    >

                </div>



                <div class="form-group">

                    <label for="productCategory">
                        Category
                    </label>

                    <input
                        type="text"
                        id="productCategory"
                        placeholder="e.g. Drinks"
                        autocomplete="off"
                        required
                    >

                </div>



                <div class="form-group">

                    <label for="productDescription">
                        Description
                    </label>

                    <textarea
                        id="productDescription"
                        rows="4"
                        placeholder="Describe the product..."
                    ></textarea>

                </div>

            </section>



            <!-- PRICING -->

            <section class="form-section">

                <div class="form-section-title">

                    <h2>
                        Pricing & Stock
                    </h2>

                </div>


                <div class="form-row">


                    <div class="form-group">

                        <label for="productPrice">
                            Selling Price
                        </label>

                        <div class="input-with-prefix">

                            <span>
                                K
                            </span>

                            <input
                                type="number"
                                id="productPrice"
                                min="0"
                                step="0.01"
                                placeholder="0.00"
                                required
                            >

                        </div>

                    </div>


                    <div class="form-group">

                        <label for="productStock">
                            Stock
                        </label>

                        <input
                            type="number"
                            id="productStock"
                            min="0"
                            step="1"
                            placeholder="0"
                            required
                        >

                    </div>


                </div>

            </section>



            <!-- OPTIONS -->

            <section class="form-section">

                <div class="form-section-title">

                    <h2>
                        Product Options
                    </h2>

                </div>


                <label class="switch-row">

                    <div>

                        <strong>
                            Featured Product
                        </strong>

                        <small>
                            Show this product in Featured
                        </small>

                    </div>

                    <input
                        type="checkbox"
                        id="productFeatured"
                    >

                    <span class="switch"></span>

                </label>


                <label class="switch-row">

                    <div>

                        <strong>
                            Active Product
                        </strong>

                        <small>
                            Allow this product to appear
                        </small>

                    </div>

                    <input
                        type="checkbox"
                        id="productActive"
                        checked
                    >

                    <span class="switch"></span>

                </label>

            </section>



            <!-- SAVE -->

            <button
                class="save-product-button"
                type="submit"
            >

                <span>
                    Add Product
                </span>

                <span>
                    →
                </span>

            </button>


        </form>

    </main>


</div>


<script src="JS/storage.js"></script>

<script src="JS/product-manager.js"></script>


</body>

</html>
